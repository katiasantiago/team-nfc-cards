<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katia Santiago</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            padding:30px;
        }

        .card{
            background:white;
            max-width:500px;
            width:100%;
            border-radius:20px;
            padding:30px;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
            text-align:center;
        }

        img{
            width:150px;
            height:150px;
            border-radius:50%;
            object-fit:cover;
        }

        h1{
            margin-top:15px;
        }

        .btn{
            display:block;
            margin:10px 0;
            padding:12px;
            border-radius:10px;
            text-decoration:none;
            color:white;
            font-weight:bold;
        }

        .linkedin{
            background:#0A66C2;
        }

        .whatsapp{
            background:#25D366;
        }

        .contacto{
            background:#444;
        }

    </style>
</head>

<body>

<div class="card">

    <img src="https://via.placeholder.com/300">

    <h1>Katia Santiago</h1>

    <h3>Analista Gestión & Análisis Comercial</h3>

    <p>
        Ayudo a convertir información comercial en estrategias y oportunidades de crecimiento.
    </p>

    <a class="btn linkedin" href="#">
        LinkedIn
    </a>

    <a class="btn whatsapp" href="#">
        WhatsApp
    </a>

    <a class="btn contacto" href="#">
        Guardar contacto
    </a>

</div>

</body>

</html>
